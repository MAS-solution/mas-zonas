<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ruta recupero 700</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root{--ink:#14213d;--soft:#3d4a6b;--line:#e2e0d8;--paper:#f6f5f1}
  html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;color:var(--ink);background:var(--paper)}
  .app{display:grid;grid-template-columns:300px minmax(0,1fr);height:100vh}
  .panel{background:#fff;border-right:1px solid var(--line);padding:14px 16px;overflow:auto;display:flex;flex-direction:column;gap:12px}
  h1{font-size:17px;margin:0}
  .etq{font-size:12px;color:var(--soft);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
  .seg{display:flex;flex-wrap:wrap;gap:4px}
  .seg button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer}
  .seg button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
  table{border-collapse:collapse;font-size:13px;width:100%}
  td,th{padding:4px 6px;border-bottom:1px solid var(--line);text-align:right}
  td:first-child,th:first-child{text-align:left}
  .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
  .ayuda{font-size:12px;color:var(--soft);margin:0;line-height:1.4}
  #mapa{height:100%}
  .nro{color:#fff;border:1.5px solid #fff;border-radius:50%;display:grid !important;place-items:center;font:600 10px sans-serif;box-shadow:0 1px 3px rgba(0,0,0,.35)}
  @media (max-width:820px){.app{grid-template-columns:1fr;grid-template-rows:55vh auto;height:auto}#mapa{height:55vh}.panel{order:2}}
</style>
</head>
<body>
<div class="app">
  <aside class="panel">
    <h1>Ruta recupero camión 700</h1>
    <p class="ayuda">Cada cliente va el día que tiene en el maestro de Gescom. Elegí vendedor y día para ver el orden de visita.</p>
    <div><div class="etq">Vendedor</div><div class="seg" id="vs"></div></div>
    <div><div class="etq">Día</div><div class="seg" id="ds"></div></div>
    <div><div class="etq">Clientes por día</div><table id="tabla"></table></div>
    <p class="ayuda" id="info"></p>
  </aside>
  <div id="mapa"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const R = /*DATOS*/[], N = /*N*/4;
const DIAS = ['Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes'];
const COL = ['#4f8ef7', '#f7614f', '#3fb67e', '#c74fa8', '#e6a817', '#17a2b8', '#a0522d', '#7b4fc7'];
let vSel = 0, dSel = -1;   // 0 = todos los vendedores, -1 = todos los días
const map = L.map('mapa', { preferCanvas: true });
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19, attribution: 'Mapa © Esri' }).addTo(map);
const capa = L.layerGroup().addTo(map);
function botones(id, items, get, set) {
  const box = document.getElementById(id);
  items.forEach(([val, txt]) => {
    const b = document.createElement('button'); b.type = 'button'; b.textContent = txt;
    b.addEventListener('click', () => { set(val); dibujar(true); });
    b.dataset.v = val; box.appendChild(b);
  });
}
botones('vs', [[0, 'Todos'], ...Array.from({ length: N }, (_, i) => [i + 1, 'V' + (i + 1)])], () => vSel, v => vSel = v);
botones('ds', [[-1, 'Todos'], ...DIAS.map((d, i) => [i, d.slice(0, 3)])], () => dSel, v => dSel = v);
const tabla = document.getElementById('tabla');
tabla.innerHTML = '<tr><th>Vend.</th>' + DIAS.map(d => `<th>${d.slice(0, 3)}</th>`).join('') + '<th>Sem.</th></tr>'
  + Array.from({ length: N }, (_, i) => {
    const v = i + 1, c = DIAS.map((_, d) => (R.find(r => r.v === v && r.d === d) || { p: [] }).p.length);
    return `<tr><td><span class="dot" style="background:${COL[i % COL.length]}"></span>V${v}</td>${c.map(n => `<td>${n}</td>`).join('')}<td><b>${c.reduce((a, b) => a + b, 0)}</b></td></tr>`;
  }).join('');
function dibujar(encuadrar) {
  document.querySelectorAll('#vs button').forEach(b => b.setAttribute('aria-pressed', Number(b.dataset.v) === vSel));
  document.querySelectorAll('#ds button').forEach(b => b.setAttribute('aria-pressed', Number(b.dataset.v) === dSel));
  capa.clearLayers();
  const sel = R.filter(r => (!vSel || r.v === vSel) && (dSel < 0 || r.d === dSel));
  const uno = vSel && dSel >= 0, todos = [];
  for (const r of sel) {
    const col = COL[(r.v - 1) % COL.length];
    if (uno || dSel >= 0) L.polyline(r.p.map(p => [p[0], p[1]]), { color: col, weight: 3, opacity: .85 }).addTo(capa);
    r.p.forEach((p, i) => {
      todos.push([p[0], p[1]]);
      const tip = `${uno ? (i + 1) + '. ' : ''}#${p[2]} ${p[3]} · V${r.v} ${DIAS[r.d]}`;
      if (uno) L.marker([p[0], p[1]], { icon: L.divIcon({ className: 'nro', html: String(i + 1), iconSize: [20, 20] }), title: tip }).addTo(capa).getElement()?.style.setProperty('background', col);
      else L.circleMarker([p[0], p[1]], { radius: 5, color: '#fff', weight: 1.5, fillColor: col, fillOpacity: 1 }).bindTooltip(tip).addTo(capa);
    });
  }
  const n = sel.reduce((a, r) => a + r.p.length, 0), km = sel.reduce((a, r) => a + r.km, 0);
  document.getElementById('info').textContent = `${n} clientes${uno || dSel >= 0 ? ` · unos ${km.toLocaleString('es-AR', { maximumFractionDigits: 1 })} km (línea recta × 1,3)` : ''}. ${uno ? 'Arranca por el cliente más cercano al centro.' : ''}`;
  if (encuadrar && todos.length) map.fitBounds(todos, { padding: [30, 30] });
}
dibujar(true);
</script>
</body>
</html>
